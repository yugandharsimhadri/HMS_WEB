<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Copied to /etc/fonts/local.conf by backend/Dockerfile.

  Every document in this application asks for the font family in Document
  branding, falling back to "Segoe UI" when a clinic has not set one
  (DocumentStyle.BodyFont / TitleFont, five call sites). Segoe UI is a
  Windows font and is not, and cannot be, installed here - so without an
  alias Skia is asked for a family that does not exist on any Linux host.

  This points that name, and the other two Windows defaults the theme can
  carry, at DejaVu Sans: installed in the image, broad coverage, and
  metrically reasonable for a receipt.

  It is a safety net, not the answer. For printed output identical on the
  Windows box and here, set Document branding -> print font to "Lato":
  QuestPDF ships Lato and registers it in-process, so it resolves the same
  on every operating system and needs no system font at all.
-->
<fontconfig>
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
