<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- The typefaces are self-hosted from /fonts and declared in index.css;
         see the note at the top of that file for why they stopped coming from
         Google. Preloaded here because a browser only discovers a @font-face
         after the stylesheet has parsed, and the UI face is needed on every
         screen — this starts it in parallel with the CSS instead of after it.
         Only the latin subsets are preloaded: latin-ext is real but rarely
         reached, and preloading a file that goes unused is wasted bandwidth. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>Sivayaan HMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
